<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beast Classroom Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="design-system.css">
<style>
  /* Scoped to the page itself, NOT `*`. As a universal rule this made
     every ancestor a clipping box, which cut off the cards' own pixel
     drop shadows (and the demo frames) wherever a card sat flush against
     #app/#game-grid's edge — visible as shadows that stop dead at the
     column edge. Only the document needs horizontal overflow suppressed
     (the boot byline is sized in vw and can exceed it on a narrow phone). */
  html, body { overflow-x: hidden; }

  /* ============ BOOT SCREEN ============
     See CLAUDE.md "Boot sequence" — lives here now (the project's true
     entry point), not on scuttle-menu.html (which is Scuttle's own
     sub-menu now — see "Where things stand"). */
  #boot-screen {
    position: fixed; inset: 0;
    background: #0a0a0a;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px;
    z-index: 100;
    cursor: pointer;
    transition: opacity 0.4s ease;
  }
  #boot-screen.fade-out { opacity: 0; pointer-events: none; }
  #boot-scanlines {
    position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(255,255,255,0.035) 0px, rgba(255,255,255,0.035) 1px, transparent 1px, transparent 3px);
  }
  #boot-flash {
    position: absolute; inset: 0; background: #fff;
    animation: bootFlash 0.35s ease-out forwards;
  }
  @keyframes bootFlash { 0% { opacity: 1; } 100% { opacity: 0; } }

  /* Single clean byline, no separate "presents" line and no second,
     redundant big "BEAST" logo underneath it (that duplication WAS the
     bug — see CLAUDE.md "Boot sequence"). This is the one and only line
     the boot screen shows, sized up from its old small-aside treatment. */
  #boot-byline {
    font-family: var(--font-pixel); font-size: 8vw; letter-spacing: 1px;
    opacity: 0; animation: fadeUp 0.5s ease-out 0.3s forwards;
  }
  @media (min-width: 500px) { #boot-byline { font-size: 32px; } }
  #boot-byline .brand-red { color: var(--color-beast-red); }
  #boot-byline .brand-blue { color: var(--color-beast-blue); }
  #boot-prompt {
    font-family: var(--font-sans); font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
    font-size: 14px; color: #eef3f8;
    opacity: 0; animation: fadeUp 0.4s ease-out 1.1s forwards, blink 1s step-start 1.5s infinite;
  }
  @keyframes fadeUp { 0% { opacity: 0; transform: translateY(8px); } 100% { opacity: 1; transform: translateY(0); } }
  @keyframes blink { 50% { opacity: 0.15; } }

  /* ============ HUB CONTENT ============ */
  #app { opacity: 0; }
  #app.visible { opacity: 1; animation: fadeUp 0.5s ease-out; }

  h1.logo {
    font-family: var(--font-pixel); font-size: 26px; text-align: center; color: var(--color-beast-red);
    letter-spacing: -0.5px;
  }

  /* Landing page shows one card per GAME (never per variant — see
     CLAUDE.md "File naming convention" and "Global navigation"), laid out
     2-up. `.variant-card` etc. are the same shared cards every game
     family's own sub-menu uses (design-system.css) — only the CONTAINER
     differs (a grid here, vs. a single flex column on a sub-menu page). */
  /* Gap has to clear a card's own 6px pixel shadow plus (on a demo-framed
     card) its 4px outline at a 4px offset, or a card's shadow/frame lands
     on top of its neighbour. Right/bottom padding does the same job at the
     grid's own outer edges. */
  .game-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; padding: 0 10px 10px 0; }
  @media (max-width: 480px) { .game-grid { grid-template-columns: 1fr; } }
  /* Full-width section headings inside the grid — keeps every card a
     direct child of #game-grid (so `#game-grid .variant-card` still
     selects them all) while splitting playable from coming-soon. */
  .game-grid .menu-section-head { grid-column: 1 / -1; }
</style>
</head>
<body>

  <div id="boot-screen">
    <div id="boot-scanlines"></div>
    <div id="boot-flash"></div>
    <div id="boot-byline"><span class="brand-red">BEAST</span> <span class="brand-blue">CLASSROOM</span></div>
    <div id="boot-prompt">Tap to start</div>
  </div>

  <div id="app">
    <h1 class="logo">BEAST 64</h1>
    <div class="kicker-wrap"><span class="kicker">Choose your game</span></div>
    <div id="tagline" class="tagline">Practice number fluency. Bot opponents included.</div>

    <div class="game-grid" id="game-grid"></div>

    <div class="menu-footer">More games unlock as they're built.</div>
  </div>

<script src="shared-game.js"></script>
<script>
/* ---------------- game grid — one card per GAME, rendered from the same
   GLOBAL_GAMES list renderGlobalNav()'s own dropdown reads (shared-game.js)
   so this page and the nav bar can never drift out of sync with each
   other — see CLAUDE.md "Global navigation".

   Redesigned after real playtesting feedback: every playable game's card
   now has a real "Play →" button that goes straight into a real game (a
   single-variant game's own file, or a multi-variant family's DEFAULT/
   first-listed variant — never a "choose one" menu page in between). A
   multi-variant game's card ALSO gets a small expandable "N variants"
   disclosure underneath, listing every sibling as its own direct link —
   see CLAUDE.md's navigation redesign note. Because the card now needs to
   hold that nested interactive disclosure, a multi-variant card is a plain
   `<div>` (the Play badge is its own `<a>`), not one big enclosing link
   the way a single-variant/locked card still is. */
function renderGameGrid(){
  const grid = document.getElementById('game-grid');
  grid.innerHTML = '';
  // Playable and coming-soon games used to run together in one
  // undifferentiated grid, leaving each card's own badge as the only
  // signal. Headings are full-width grid items, so every card stays a
  // direct child of #game-grid.
  let sectionsEmitted = { playable: false, locked: false };
  const emitHead = (text) => {
    const h = document.createElement('div');
    h.className = 'menu-section-head';
    h.textContent = text;
    grid.appendChild(h);
  };
  GLOBAL_GAMES.forEach(g => {
    const isLocked = g.status === 'locked';
    if (!isLocked && !sectionsEmitted.playable){ emitHead('Playable now'); sectionsEmitted.playable = true; }
    if (isLocked && !sectionsEmitted.locked){ emitHead('Coming soon'); sectionsEmitted.locked = true; }
    const hasVariants = !isLocked && Array.isArray(g.variants) && g.variants.length > 1;
    const playHref = isLocked ? null : (hasVariants ? g.variants[0].href : g.href);

    const card = document.createElement((isLocked || hasVariants) ? 'div' : 'a');
    card.className = 'variant-card' + (isLocked ? ' locked' : ' active')
      // TEMPORARY dotted frame marking the games that have the
      // answer-explanation demo built — see CLAUDE.md "Answer-explanation
      // modal & stats-demo experiment". Remove with the experiment.
      + (!isLocked && gameHasDemo(g) ? ' demo-framed' : '');
    if (isLocked) card.setAttribute('aria-disabled', 'true');
    if (!isLocked && !hasVariants) card.href = playHref;

    const top = document.createElement('div');
    top.className = 'variant-top';
    const nameWrap = document.createElement('span');
    nameWrap.className = 'variant-name-wrap';
    const name = document.createElement('span');
    name.className = 'variant-name';
    name.textContent = g.name;
    nameWrap.appendChild(name);
    // TEMPORARY DEMO chip — the dotted frame can't say what it means on
    // its own. Remove with the experiment.
    if (!isLocked && gameHasDemo(g)) nameWrap.appendChild(demoBadgeEl());
    top.appendChild(nameWrap);

    let badge;
    if (isLocked){
      badge = document.createElement('span');
      badge.className = 'badge soon';
      badge.textContent = 'Coming soon';
    } else if (hasVariants){
      // The card itself isn't the link anymore (see above) — the badge IS
      // the real "Play" link here, straight to the family's default variant.
      badge = document.createElement('a');
      badge.className = 'badge play';
      badge.href = playHref;
      badge.textContent = 'Play →';
    } else {
      badge = document.createElement('span');
      badge.className = 'badge play';
      badge.textContent = 'Play →';
    }
    top.appendChild(badge);
    card.appendChild(top);

    const desc = document.createElement('div');
    desc.className = 'variant-desc';
    desc.textContent = g.desc || '';
    card.appendChild(desc);

    if (hasVariants){
      const toggle = document.createElement('button');
      toggle.type = 'button';
      toggle.className = 'variant-expand-toggle';
      const setToggleLabel = (open) => { toggle.textContent = `${open ? '▴' : '▾'} ${g.variants.length} variants`; };
      setToggleLabel(false);
      card.appendChild(toggle);

      const list = document.createElement('div');
      list.className = 'variant-sublist hidden';
      g.variants.forEach(v => {
        const link = document.createElement('a');
        // TEMPORARY per-variant DEMO chip — the card-level chip says
        // "something in this family is demo-ready", this says which ones.
        const isDemo = isDemoReady(v.href);
        link.className = 'variant-sublink' + (isDemo ? ' demo-framed' : '');
        link.href = v.href;
        link.appendChild(document.createTextNode(v.name));
        if (isDemo) link.appendChild(demoBadgeEl());
        list.appendChild(link);
      });
      card.appendChild(list);

      toggle.addEventListener('click', () => {
        const opening = list.classList.contains('hidden');
        list.classList.toggle('hidden');
        setToggleLabel(opening);
        if (opening) fadeIn(list);
      });
    }

    grid.appendChild(card);
  });

  // TEMPORARY legend explaining the dotted frames — remove with the
  // experiment (see CLAUDE.md "Answer-explanation modal & stats-demo
  // experiment").
  if (!document.querySelector('.demo-legend')){
    grid.parentNode.insertBefore(demoLegendEl(), grid);
  }
}
renderGameGrid();
renderGlobalNav(); // no current game — this IS the hub. See CLAUDE.md "Global navigation".

/* ---------------- boot sequence — see CLAUDE.md "Boot sequence" ---------------- */
const boot = document.getElementById('boot-screen');
const app = document.getElementById('app');
let advanced = false;

// Once per browser session, not once ever — sessionStorage (not
// localStorage) so a fresh session (new tab, browser restart) sees the
// full boot animation again, but repeat visits to the hub WITHIN one
// session (e.g. "Change settings" -> back to the hub -> pick another
// game) skip straight to the menu. Guarded the same defensive way
// prefersReducedMotion() guards matchMedia elsewhere in this project —
// storage can be unavailable (blocked, private-mode edge cases); if so,
// just always show the animation rather than throwing.
const BOOT_SESSION_KEY = 'beastClassroomBootSeen';
function bootSeenThisSession(){
  try { return sessionStorage.getItem(BOOT_SESSION_KEY) === '1'; }
  catch (e) { return false; }
}
function markBootSeen(){
  try { sessionStorage.setItem(BOOT_SESSION_KEY, '1'); }
  catch (e) { /* storage unavailable — nothing to persist, harmless */ }
}

function playChime(){
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const notes = [523.25, 659.25, 783.99];
    notes.forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'square';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.06, ctx.currentTime + i*0.09);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + i*0.09 + 0.15);
      osc.connect(gain).connect(ctx.destination);
      osc.start(ctx.currentTime + i*0.09);
      osc.stop(ctx.currentTime + i*0.09 + 0.16);
    });
  } catch (e) { /* audio not available/blocked — ignore silently */ }
}

function advanceToMenu(){
  if (advanced) return;
  advanced = true;
  playChime();
  boot.classList.add('fade-out');
  setTimeout(() => {
    boot.style.display = 'none';
    app.classList.add('visible');
  }, 400);
}

if (bootSeenThisSession()){
  // Repeat visit this session — skip straight to the hub, no animation,
  // no delay, nothing to click through again.
  boot.style.display = 'none';
  app.classList.add('visible');
} else {
  markBootSeen();
  boot.addEventListener('click', advanceToMenu);
  window.addEventListener('keydown', advanceToMenu, { once: true });
  // Shortened from the original 4500ms now that the sequence is a single
  // line (byline + prompt), not four separately-staged elements.
  setTimeout(advanceToMenu, 2600);
}
</script>
</body>
</html>
